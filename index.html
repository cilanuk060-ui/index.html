
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atendimento RGE</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    header {
      background: #d71920;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    .logo {
      width: 66px;
      height: 66px;
      margin: 0 auto 12px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg {
      width: 38px;
      height: 38px;
      fill: #d71920;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    header p {
      margin: 0;
      font-size: 15px;
    }

    main {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 18px;
    }

    .botao {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 58px;
      margin-bottom: 14px;
      padding: 15px 12px;
      border-radius: 9px;
      background: #d71920;
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .botao:hover {
      background: #b51219;
    }

    .whatsapp {
      width: 25px;
      height: 25px;
      flex-shrink: 0;
      fill: currentColor;
    }

    footer {
      text-align: center;
      padding: 10px 16px 24px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M13.2 1 4.8 13h5.8L9.5 23 19.2 9.5h-6.1L13.2 1z"/>
      </svg>
    </div>
    <h1>Atendimento RGE</h1>
    <p>Central de atendimento</p>
  </header>

  <main id="servicos"></main>

  <footer>
    Atendimento via WhatsApp informado pelo responsável deste site.
  </footer>

  <script>
    const telefone = "5581984669626";

    const iconeWhatsApp = `
      <svg class="whatsapp" viewBox="0 0 32 32"
           aria-hidden="true">
        <path d="M16 .5A15.3 15.3 0 0 0 2.8 23.5L1 31l7.7-2
        A15.5 15.5 0 1 0 16 .5zm0 28a12.5 12.5 0 0 1-6.3-1.7
        l-.5-.3-4.6 1.2 1.2-4.5-.3-.5A12.4 12.4 0 1 1
        16 28.5zm6.8-9.3c-.4-.2-2.3-1.1-2.7-1.2
        -.4-.1-.6-.2-.9.2-.3.4-1 1.2-1.2 1.5
        -.2.3-.5.3-.9.1-2.5-1.2-4.1-2.2-5.7-5
        -.4-.7.4-.7 1.2-2.2.1-.3 0-.6-.1-.8
        -.1-.2-.9-2.1-1.3-2.8-.3-.7-.7-.6-.9-.6
        h-.8c-.3 0-.8.1-1.2.6-.4.4-1.5 1.5-1.5 3.5
        s1.5 4 1.7 4.2c.2.3 2.9 4.5 7.1 6.3
        2.6 1.1 3.6 1.2 4.9 1 .8-.1 2.3-.9 2.6-1.8
        .3-.9.3-1.7.2-1.8-.1-.2-.4-.3-.8-.5z"/>
      </svg>`;

    const servicos = [
      ["Atendimento RGE",
       "Olá! Gostaria de atendimento."],
      ["Pagar fatura agora (Pix)",
       "Olá! Gostaria de informações para pagar minha fatura via Pix."],
      ["Consultar faturas em aberto",
       "Olá! Gostaria de consultar minhas faturas em aberto."],
      ["Solicitar 2ª via da fatura",
       "Olá! Gostaria de solicitar a segunda via da minha fatura."],
      ["Outros assuntos",
       "Olá! Gostaria de atendimento sobre outros assuntos."]
    ];

    const area = document.getElementById("servicos");

    servicos.forEach(([titulo, mensagem]) => {
      const botao = document.createElement("a");
      botao.className = "botao";
      botao.href = `https://wa.me/${telefone}?text=${encodeURIComponent(mensagem)}`;
      botao.target = "_blank";
      botao.rel = "noopener noreferrer";
      botao.innerHTML = `${iconeWhatsApp}<span>${titulo}</span>`;
      area.appendChild(botao);
    });
  </script>

</body>
</html>
